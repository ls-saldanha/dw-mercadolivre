name: dbt docs → GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync

      - name: Create dbt profiles.yml
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          cat > dbt/profiles.yml << EOF
          dw_mercadolivre:
            target: dev
            outputs:
              dev:
                type: postgres
                host: db.lmjfqxjrlmlrphgdictw.supabase.co
                port: 5432
                database: postgres
                user: postgres
                password: "${SUPABASE_DB_PASSWORD}"
                schema: public
                threads: 1
          EOF

      - name: Generate dbt docs
        run: uv run dbt docs generate --profiles-dir dbt --project-dir dbt

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dbt/target/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
